<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Dogs BaseHunting / QQL Tools</title>
  <desc id="desc">A colorful abstract banner for a Minecraft base hunting utility addon.</desc>
  <defs>
