      <stop offset="0" stop-color="#132a3a"/>
      <stop offset="0.58" stop-color="#176b73"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173b46"/>
      <stop offset="1" stop-color="#264653"/>
