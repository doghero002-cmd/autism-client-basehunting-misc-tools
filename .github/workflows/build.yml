      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-jar
          path: build/libs/*.jar

      - name: Release dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
